<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Kerith Paul Perla - AI Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="50%" stop-color="#151a33"/>
      <stop offset="100%" stop-color="#1b0f2e"/>
      <animate attributeName="x2" values="1;0.6;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#f472b6;#22d3ee;#a78bfa" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c0"><rect x="60" y="165" height="40"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.02;0.10;0.21;0.22;1" values="0;0;340;340;0;0"/></rect></clipPath>
    <clipPath id="c1"><rect x="60" y="165" height="40"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.25;0.36;0.46;0.47;1" values="0;0;600;600;0;0"/></rect></clipPath>
    <clipPath id="c2"><rect x="60" y="165" height="40"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.50;0.60;0.71;0.72;1" values="0;0;520;520;0;0"/></rect></clipPath>
    <clipPath id="c3"><rect x="60" y="165" height="40"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0;0.75;0.86;0.96;0.97;1" values="0;0;590;590;0;0"/></rect></clipPath>
  </defs>

  <rect width="900" height="280" rx="18" fill="url(#bg)"/>

  <!-- drifting network -->
  <g stroke="#6366f1" stroke-opacity="0.35" stroke-width="1">
    <line x1="720" y1="50" x2="800" y2="110"><animate attributeName="x2" values="800;780;800" dur="7s" repeatCount="indefinite"/></line>
    <line x1="800" y1="110" x2="860" y2="60"/>
    <line x1="800" y1="110" x2="760" y2="200"><animate attributeName="y2" values="200;225;200" dur="9s" repeatCount="indefinite"/></line>
    <line x1="760" y1="200" x2="850" y2="230"/>
    <line x1="720" y1="50" x2="640" y2="95"/>
    <line x1="640" y1="95" x2="760" y2="200"/>
    <line x1="860" y1="60" x2="850" y2="230"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="720" cy="50" r="5" fill="#22d3ee"><animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="110" r="7" fill="#a78bfa"><animate attributeName="r" values="6;9;6" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="60" r="4" fill="#f472b6"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="200" r="6" fill="#22d3ee"><animate attributeName="r" values="5;8;5" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="230" r="4" fill="#a78bfa"/>
    <circle cx="640" cy="95" r="4" fill="#f472b6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <!-- data packets travelling the network -->
  <circle r="3" fill="#fff" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M720,50 L800,110 L760,200 L850,230"/>
  </circle>
  <circle r="3" fill="#fde68a" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M640,95 L720,50 L800,110 L860,60"/>
  </circle>

  <!-- floating particles -->
  <g fill="#fff" fill-opacity="0.5">
    <circle cx="120" cy="40" r="1.5"><animate attributeName="cy" values="40;20;40" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="70" r="1.2"><animate attributeName="cy" values="70;50;70" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="30" r="1.8"><animate attributeName="cy" values="30;55;30" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="240" r="1.4"><animate attributeName="cy" values="240;220;240" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="250" r="1.6"><animate attributeName="cy" values="250;232;250" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <text x="60" y="100" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8" letter-spacing="6">HELLO, WORLD · I'M</text>
  <text x="60" y="148" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" fill="url(#title)" filter="url(#glow)">Kerith Paul Perla</text>

  <!-- typed rotating subtitle -->
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="22" fill="#e2e8f0">
    <text x="60" y="193" clip-path="url(#c0)">AI Developer @ LexFintech</text>
    <text x="60" y="193" clip-path="url(#c1)">Building RAG pipelines &amp; multi-agent systems</text>
    <text x="60" y="193" clip-path="url(#c2)">Microservices · LLMs · Computer Vision</text>
    <text x="60" y="193" clip-path="url(#c3)">CEH v12 · Oracle GenAI Certified Professional</text>
  </g>
  <rect x="60" y="205" width="14" height="3" rx="1.5" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline sweep -->
  <rect x="0" y="0" width="900" height="3" fill="#22d3ee" fill-opacity="0.15">
    <animate attributeName="y" values="0;280;0" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
